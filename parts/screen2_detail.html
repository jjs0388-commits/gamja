<!-- ========================================================
  [화면 2] 감자(Gamza) 상품 상세 팝업 (모달) 컴포넌트
  ======================================================== -->
<div id="gamzaDetailModal" class="gamza-modal-overlay" aria-hidden="true" role="dialog" aria-labelledby="modalProductTitle">
  <div class="gamza-modal-backdrop" onclick="closeDetailModal()"></div>

  <div class="gamza-modal-container" role="document">
    <!-- 모바일 드래그 핸들 (바텀시트 느낌 연출) -->
    <div class="gamza-bottomsheet-handle" aria-hidden="true">
      <span class="handle-bar"></span>
    </div>

    <!-- 닫기 버튼 -->
    <button type="button" class="gamza-modal-close-btn" onclick="closeDetailModal()" aria-label="팝업 닫기">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <!-- 스크롤 가능한 본문 영역 -->
    <div class="gamza-modal-scroll-body">
      
      <!-- 상단 대표 이미지 영역 -->
      <div class="gamza-modal-image-wrap">
        <img id="modalProductImage" src="" alt="상품 대표 이미지" class="gamza-modal-image" loading="lazy" />
        <div class="image-gradient-overlay" aria-hidden="true"></div>
        <div id="modalImageBadgeGroup" class="modal-image-badges">
          <span id="modalStatusBadge" class="gamza-badge status-selling">판매중</span>
          <span id="modalCategoryBadge" class="gamza-badge category-badge">기타</span>
        </div>
      </div>

      <!-- 판매자 정보 섹션 -->
      <div class="gamza-seller-section">
        <div class="seller-profile-left">
          <div class="seller-avatar-wrap">
            <img id="modalSellerAvatar" src="" alt="판매자 프로필" class="seller-avatar" />
            <span class="seller-online-dot" title="활동중"></span>
          </div>
          <div class="seller-text-info">
            <div class="seller-nickname-wrap">
              <span id="modalSellerNickname" class="seller-nickname">감자마스터</span>
              <span class="seller-level-tag">인증판매자</span>
            </div>
            <span id="modalSellerLocation" class="seller-location">서울시 강남구 역삼동</span>
          </div>
        </div>

        <!-- 감자 매너온도/지수 -->
        <div class="seller-manner-temp-box">
          <div class="temp-header">
            <span class="temp-label">🥔 감자온도</span>
            <span id="modalSellerTemp" class="temp-value">37.5℃</span>
          </div>
          <div class="temp-bar-bg" role="progressbar" aria-valuenow="37.5" aria-valuemin="0" aria-valuemax="100">
            <div id="modalTempBarFill" class="temp-bar-fill" style="width: 37.5%;"></div>
          </div>
          <span class="temp-face-icon" id="modalTempEmoji">😊</span>
        </div>
      </div>

      <hr class="gamza-divider" />

      <!-- 상품 상세 정보 섹션 -->
      <div class="gamza-detail-content">
        <!-- 상품 타이틀 & 메타 정보 -->
        <div class="detail-header-group">
          <h2 id="modalProductTitle" class="detail-title">상품 제목이 여기에 표시됩니다</h2>
          <div class="detail-meta-row">
            <span class="detail-meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
              <span id="modalProductLocation">역삼동</span>
            </span>
            <span class="meta-separator">·</span>
            <span class="detail-meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span id="modalProductTime">방금 전</span>
            </span>
            <span class="meta-separator">·</span>
            <span class="detail-meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span id="modalProductViews">조회 12</span>
            </span>
          </div>
        </div>

        <!-- 가격 표시 -->
        <div class="detail-price-box">
          <span class="price-label">판매가</span>
          <div class="price-val-wrap">
            <span id="modalProductPrice" class="detail-price">35,000</span>
            <span class="currency-unit">원</span>
            <span id="modalPriceNegotiable" class="price-badge-nego">가격제안 가능</span>
          </div>
        </div>

        <!-- 상품 본문 설명 (줄바꿈 지원) -->
        <div class="detail-description-wrap">
          <h3 class="detail-section-title">상품 설명</h3>
          <p id="modalProductDescription" class="detail-description-text">
            상품 상세 설명 내용이 들어갑니다.
          </p>
        </div>

        <!-- 거래 희망 장소 안내 카드 -->
        <div class="detail-trade-location-card">
          <div class="trade-loc-icon">📍</div>
          <div class="trade-loc-text">
            <strong>희망 거래 장소</strong>
            <p id="modalTradeLocation">역삼역 4번 출구 앞 또는 인근 직거래 선호</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 하단 고정 액션 버튼 바 -->
    <div class="gamza-modal-bottom-bar">
      <!-- 관심 (찜) 토글 버튼 -->
      <button type="button" id="modalWishBtn" class="gamza-wish-btn" onclick="toggleWishItem(this)" aria-label="관심 상품 추가">
        <svg class="heart-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <span id="modalWishCount" class="wish-count">5</span>
      </button>

      <div class="bottom-bar-divider"></div>

      <!-- 하단 미니 가격 표시 -->
      <div class="bottom-bar-price-preview">
        <span id="modalBottomPrice" class="bottom-price-val">35,000원</span>
      </div>

      <!-- 채팅 시작하기 메인 액션 버튼 -->
      <button type="button" id="modalChatBtn" class="gamza-chat-btn" onclick="handleStartChat()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>채팅 시작하기</span>
      </button>
    </div>
  </div>
</div>
